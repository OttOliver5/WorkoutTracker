<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelszó változtatás</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <a href="index.html" class="btn btn-secondary mb-3">&larr; Vissza</a>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Jelszó változtatás</h4>
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label class="form-label">Jelenlegi jelszó</label>
                                <input type="password" class="form-control" id="currentPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Új jelszó</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Új jelszó mégegyszer</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Mentés</button>
                        </form>
                        <p id="message" class="mt-3 text-center"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="change-password.js"></script>
</body>
</html>
