<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker - Gyakorlatok</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">💪 Workout Tracker</span>
        <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Vissza</a>
    </nav>

    <div class="container mt-4">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Új gyakorlat rögzítése</h5>
                <form id="exerciseForm">
                    <div class="mb-3">
                        <label class="form-label">Név</label>
                        <input type="text" class="form-control" id="exerciseName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategória</label>
                        <input type="text" class="form-control" id="exerciseCategory" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Mentés</button>
                </form>
            </div>
        </div>

        <h5>Gyakorlatok listája</h5>
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Név</th>
                    <th>Kategória</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="exerciseTableBody"></tbody>
        </table>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="exercises.js"></script>
</body>
</html>
