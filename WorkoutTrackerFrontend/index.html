<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">💪 Workout Tracker</span>
        <div style="position:relative;">
            <button class="btn btn-outline-light" onclick="toggleMenu()">
                👤 <span id="usernameDisplay"></span> ▼
            </button>
            <div id="dropdownMenu" class="card shadow" style="display:none; position:absolute; right:0; min-width:200px; z-index:999;">
                <div class="card-body p-2 d-flex flex-column gap-2">
                    <a href="exercises.html" class="btn btn-outline-secondary btn-sm">💪 Gyakorlat szerkesztő</a>
                    <a href="change-password.html" class="btn btn-outline-secondary btn-sm">🔑 Jelszó változtatás</a>
                    <button onclick="logout()" class="btn btn-outline-danger btn-sm">🚪 Kijelentkezés</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Új edzés hozzáadása</h5>
                <form id="workoutForm">
                    <div class="mb-3">
                        <label class="form-label">Név</label>
                        <input type="text" class="form-control" id="workoutName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dátum</label>
                        <input type="datetime-local" class="form-control" id="workoutDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Megjegyzés</label>
                        <input type="text" class="form-control" id="workoutNotes">
                    </div>
                    <button type="submit" class="btn btn-primary">Mentés</button>
                </form>
            </div>
        </div>

        <h5>Edzések listája</h5>
        <p id="emptyMessage" style="display:none;" class="text-muted">Még nincs rögzített edzésed – adj hozzá egyet!</p>
        <table id="workoutTable" class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Név</th>
                    <th>Dátum</th>
                    <th>Megjegyzés</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="workoutTableBody"></tbody>
        </table>

    </div>

    <script src="index.js"></script>
</body>
</html>
