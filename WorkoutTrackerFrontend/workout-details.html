<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker - Edzés részletei</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">💪 Workout Tracker</span>
        <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Vissza az edzésekhez</a>
    </nav>

    <div class="container mt-4">

        <h2 id="workoutTitle">Edzés részletei</h2>
        <p id="workoutDateInfo" class="text-muted"></p>

        <hr>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Új szett hozzáadása</h5>
                <form id="setForm">
                    <div class="mb-3">
                        <label class="form-label">Gyakorlat</label>
                        <select class="form-select" id="exerciseSelect" required>
                            <option value="">-- Válassz gyakorlatot --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Súly (kg)</label>
                        <input type="number" step="0.5" class="form-control" id="setWeight" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ismétlés</label>
                        <input type="number" class="form-control" id="setReps" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Szett mentése</button>
                </form>
            </div>
        </div>

        <h5>Elvégzett szettek</h5>
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Gyakorlat</th>
                    <th>Súly (kg)</th>
                    <th>Ismétlés</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="setsTableBody"></tbody>
        </table>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="workout-details.js"></script>
</body>
</html>
