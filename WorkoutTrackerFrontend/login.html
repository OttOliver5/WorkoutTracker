<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker - Bejelentkezés</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h1 class="text-center mb-4">Workout Tracker</h1>

                <div class="mb-3 d-flex gap-2">
                    <button class="btn btn-primary w-100" onclick="showForm('login')">Bejelentkezés</button>
                    <button class="btn btn-outline-primary w-100" onclick="showForm('register')">Regisztráció</button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">

                        <div id="loginSection">
                            <h4 class="card-title mb-4">Bejelentkezés</h4>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label">Felhasználónév</label>
                                    <input type="text" class="form-control" id="loginUsername" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jelszó</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Bejelentkezés</button>
                            </form>
                        </div>

                        <div id="registerSection" style="display:none;">
                            <h4 class="card-title mb-4">Regisztráció</h4>
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label">Felhasználónév</label>
                                    <input type="text" class="form-control" id="registerUsername" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="registerEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jelszó</label>
                                    <input type="password" class="form-control" id="registerPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Regisztráció</button>
                            </form>
                        </div>

                    </div>
                </div>
                <p id="message" class="mt-3 text-center"></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
